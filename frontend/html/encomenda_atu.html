
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/encomenda_atu.js" defer></script>
    <title>Atualizar Encomenda</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="./encomenda_cad.html">Cadastrar</a>
            <a href="./encomenda_list.html">Listar</a>
            <a href="./encomenda_atu.html">Atualizar Status</a>
        </nav>
    </header>

    <main>
        <h1>Atualizar Status da Encomenda</h1>

        <form>
            <label for="codEncomenda">ID da Encomenda</label>
            <input type="number" id="codEncomenda" min="1" required>
            <br><br>

            <label for="statusAtual">Novo Status</label>
            <select id="statusAtual" required>
                <option value="">Selecione o status</option>
                <option value="TRANSITO">Em trânsito</option>
                <option value="SAIU_ENTREGA">Saiu para entrega</option>
                <option value="ENTREGUE">Entregue</option>
            </select>
            <br><br>

            <button id="btn_atu">Atualizar Status</button>
        </form>

        <br>
        <div id="res_atu_encomenda"></div>
    </main>
</body>
</html>
